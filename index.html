const PLATFORMS = { windows: "Windows", macos: "macOS", linux: "Linux", web: "Web", android: "Android" };
const CATS = ["own", "graphics", "av", "office", "comms", "design", "tools", "devtools", "os", "community", "android"];

let lang = localStorage.getItem("cg-lang")
  || (navigator.language && navigator.language.startsWith("hu") ? "hu" : "en");
let activeCats = new Set();
let onlyReleases = false;
let onlyNew = false;
let authorFilter = "";
let query = "";
let sortBy = "stars";
const NEW_MS = 48 * 3600 * 1000;   /* 48 ora */
const isNew = r => r.added_at && (Date.now() - Date.parse(r.added_at) < NEW_MS);

const t = k => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function fmtStars(n) {
  if (n >= 1000) return (n / 1000).toFixed(1).replace(".", ",").replace(",0", "") + "k";
  return String(n);
}

function cardHTML(r) {
  const rel = r.release;
  const relHTML = rel
    ? `<span class="rel">⬆ ${esc(rel.tag)}${rel.date ? " · " + esc(rel.date) : ""}${rel.source_only ? " (" + t("source_only") + ")" : ""}</span>`
    : `<span class="rel none">${t("no_release")}</span>`;
  const plats = (r.platforms || []).map(p => `<span class="plat">${esc(PLATFORMS[p] || p)}</span>`).join("");
  const repl = r.replaces ? `<span class="replaces">${t("replaces")} ${esc(r.replaces)}</span>` : "";
  const own = r.own ? `<span class="own">${t("own")}</span>` : "";
  const note = r.note ? `<p class="note">${esc(r.note[lang] || r.note.hu || "")}</p>` : "";
  const newb = isNew(r) ? `<span class="newb">${t("new")}</span>` : "";
  const st = r.status ? `<span class="status">${t("st_" + r.status) !== ("st_" + r.status) ? t("st_" + r.status) : esc(r.status)}</span>` : "";
  const compat = r.compatibility ? `<span class="compat">${esc(t("compat_" + r.compatibility) || r.compatibility)}</span>` : "";
  const home = r.homepage ? ` · <a href="${esc(r.homepage)}" target="_blank" rel="noopener">${t("website")}</a>` : "";
  return `
  <article class="card" data-name="${esc((r.name + " " + (r.replaces || "") + " " + (r.description || "")).toLowerCase())}">
    <div class="card-top">
      <h2>${esc(r.name)}</h2>
      ${repl}${own}${newb}
    </div>
    ${note}
    <p class="desc">${esc(r.description || "")}</p>
    <div class="plats">${plats}${st}${compat}</div>
    <div class="meta">
      <span class="stars">★ ${fmtStars(r.stars || 0)}</span>
      ${relHTML}
      ${r.license ? `<span class="lic">${esc(r.license)}</span>` : ""}
    </div>
    <div class="links">
      <a href="${esc(r.url)}" target="_blank" rel="noopener">${t("repo")}</a>${r.release ? ` ·
      <a href="${esc(r.releases_url)}" target="_blank" rel="noopener">${t("releases")}</a>` : ""}${home}
    </div>
  </article>`;
}

function render() {
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.getElementById("langtoggle").textContent = lang === "hu" ? "EN" : "HU";
  document.documentElement.lang = lang;
  renderOwnerSel();

  const main = document.getElementById("main");
  let html = "";
  for (const cat of CATS) {
    if (activeCats.size && !activeCats.has(cat)) continue;
    const items = DATA.filter(r => r.category === cat);
    const shown = items.filter(r =>
      (!onlyReleases || r.release) &&
      (!onlyNew || isNew(r)) &&
      (!authorFilter || r.repo.split("/")[0] === authorFilter) &&
      (r.name + " " + (r.replaces || "") + " " + (r.description || "")).toLowerCase().includes(query));
    shown.sort((a, b) => sortBy === "name"
      ? a.name.localeCompare(b.name)
      : (b.stars || 0) - (a.stars || 0));
    if (!shown.length) continue;
    html += `<section class="cat"><h2 class="cat-title">${t("section_" + cat)} <span class="count">${shown.length} ${t("count_suffix")}</span></h2><div class="grid">`;
    html += shown.length ? shown.map(cardHTML).join("") : `<p class="empty">${t("empty")}</p>`;
    html += `</div></section>`;
  }
  if (!html) html = `<p class="empty">${t("empty")}</p>`;
  main.innerHTML = html;
}

function renderCatFilter() {
  const el = document.getElementById("catfilter");
  const chips = [
    ["all", "cat_all", !activeCats.size],
    ["releases", "cat_releases", onlyReleases],
    ["new", "cat_new", onlyNew],
    ...CATS.map(c => [c, "cat_" + c, activeCats.has(c)]),
  ];
  el.innerHTML = chips.map(([v, k, on]) =>
    `<button class="chip${on ? " on" : ""}" data-cat="${v}">${t(k)}</button>`).join("");
  el.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => {
      const v = b.dataset.cat;
      if (v === "all") { activeCats.clear(); authorFilter = ""; }
      else if (v === "releases") onlyReleases = !onlyReleases;
      else if (v === "new") onlyNew = !onlyNew;
      else if (activeCats.has(v)) activeCats.delete(v);
      else activeCats.add(v);
      renderCatFilter(); render();
    }));
}

const OWNER_COUNT = {};
DATA.forEach(r => { const o = r.repo.split("/")[0]; OWNER_COUNT[o] = (OWNER_COUNT[o] || 0) + 1; });
const OWNERS = Object.keys(OWNER_COUNT).sort((a, b) => OWNER_COUNT[b] - OWNER_COUNT[a] || a.localeCompare(b));

function renderOwnerSel() {
  const el = document.getElementById("ownersel");
  el.innerHTML = `<option value="">${t("author_all")}</option>` +
    OWNERS.map(o => `<option value="${esc(o)}"${o === authorFilter ? " selected" : ""}>${esc(o)} (${OWNER_COUNT[o]})</option>`).join("");
}

document.getElementById("ownersel").addEventListener("change", e => {
  authorFilter = e.target.value; render();
});
document.getElementById("sortsel").addEventListener("change", e => {
  sortBy = e.target.value; render();
});
document.getElementById("search").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase(); render();
});
document.getElementById("langtoggle").addEventListener("click", () => {
  lang = lang === "hu" ? "en" : "hu";
  localStorage.setItem("cg-lang", lang);
  renderCatFilter(); render();
});

renderCatFilter();
render();
